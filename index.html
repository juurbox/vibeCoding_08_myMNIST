<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손글씨 숫자 인식기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 영역 -->
    <header class="header">
      <div class="title-row">
        <span class="icon-badge">✏️</span>
        <h1>손글씨 숫자 인식기</h1>
      </div>
      <p class="subtitle">마우스로 네모 칸 안에 <strong>0부터 9까지의 숫자</strong>를 한 글자 그려보세요.</p>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">AI 모델 불러오는 중...</span>
      </div>
    </header>

    <!-- 메인 카드 -->
    <main class="main-card">
      <!-- 캔버스(그리기 스케치북) 영역 -->
      <div class="canvas-wrapper">
        <div class="canvas-header">
          <span class="canvas-label">스케치북</span>
          <div class="pen-tools">
            <span class="tool-label">펜 굵기</span>
            <button type="button" class="pen-btn" data-size="14">보통</button>
            <button type="button" class="pen-btn active" data-size="22">굵게</button>
          </div>
        </div>

        <div class="canvas-box">
          <canvas id="drawCanvas" width="280" height="280"></canvas>
          <div class="canvas-guide" id="canvasGuide">여기에 마우스로 숫자를 그려보세요</div>
        </div>

        <!-- 옵션: 자동 인식 토글 -->
        <div class="options-row">
          <label class="auto-toggle-label">
            <input type="checkbox" id="autoPredictToggle">
            <span class="checkbox-custom"></span>
            마우스 떼면 자동 인식
          </label>
          <span class="shortcut-hint">단축키: <kbd>Space</kbd> 인식 / <kbd>Del</kbd> 지우기</span>
        </div>

        <!-- 조작 버튼들 -->
        <div class="button-group">
          <button type="button" id="clearBtn" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
            </svg>
            지우기
          </button>
          <button type="button" id="predictBtn" class="btn btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            인식하기
          </button>
        </div>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 결과 표시 영역 -->
      <section class="result-section" aria-live="polite">
        <h2 class="section-title">분석 결과</h2>

        <!-- 대기 상태 (안내 메시지) -->
        <div id="emptyResultState" class="empty-result">
          <div class="empty-icon">🔢</div>
          <p>숫자를 그리고 <strong>[인식하기]</strong> 버튼을 누르면<br>인식 결과와 정확도가 표시됩니다.</p>
        </div>

        <!-- 결과 카드 (인식 완료 시 활성화) -->
        <div id="resultCard" class="result-card hidden">
          <div class="primary-result-box">
            <div class="result-item">
              <span class="result-label">인식결과</span>
              <span class="result-digit" id="recognizedDigit">-</span>
            </div>
            <div class="result-v-divider"></div>
            <div class="result-item">
              <span class="result-label">정확도</span>
              <div class="confidence-badge" id="confidenceBadge">
                <span id="confidenceValue">0.0%</span>
              </div>
            </div>
          </div>

          <!-- 정확도 게이지 바 -->
          <div class="meter-wrapper">
            <div class="meter-labels">
              <span>확신 수준</span>
              <span id="meterText" class="meter-text">매우 높음</span>
            </div>
            <div class="meter-bar-bg">
              <div id="meterBarFill" class="meter-bar-fill" style="width: 0%;"></div>
            </div>
          </div>

          <!-- 컴퓨터가 바라본 28x28 이미지 및 전체 후보군 확인 -->
          <div class="details-accordion">
            <button type="button" id="toggleDetailsBtn" class="accordion-header">
              <span>자세한 후보별 확률 보기</span>
              <span class="accordion-arrow">▼</span>
            </button>
            <div id="detailsContent" class="accordion-body hidden">
              <div class="preview-box">
                <span class="preview-label">AI가 전처리한 28×28 이미지</span>
                <canvas id="previewCanvas" width="28" height="28"></canvas>
              </div>
              <div class="probabilities-list" id="probList">
                <!-- 0~9 확률 막대들이 동적으로 채워집니다 -->
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 사용자 꿀팁 가이드 -->
    <footer class="footer-tip">
      <span class="tip-icon">💡</span>
      <p><strong>인식률 높이는 팁:</strong> 숫자를 사각형 가운데에 적당한 크기로 시원시원하게 그리면 가장 정확하게 인식합니다.</p>
    </footer>
  </div>

  <!-- 토스트 알림창 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 라이브러리 및 스크립트 로드 -->
  <script src="lib/tf.min.js"></script>
  <script>
    if (typeof tf === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"><\/script>');
    }
  </script>
  <script src="model/model_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
